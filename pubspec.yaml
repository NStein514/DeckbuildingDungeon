name: deckbound
description: A tactical deckbuilding adventure through the Ashen Crypt.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  web: ^1.1.1
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/heroes/
    - assets/images/enemies/
    - assets/images/cards/
    - assets/images/events/
    - assets/images/effects/
    - assets/images/relics/
    - assets/images/backgrounds/
    - assets/images/ui/
